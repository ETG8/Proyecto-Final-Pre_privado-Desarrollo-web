<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro al taller de Desarrollo Web</title>
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body>
  <main class="contenedor">
    <header class="encabezado">
      <p class="etiqueta">Universidad · Actividad de clase</p>
      <h1>Registro al taller</h1>
      <p>Completa tus datos para reservar un espacio.</p>
    </header>

    <section class="panel" aria-labelledby="titulo-formulario">
      <h2 id="titulo-formulario">Datos de inscripción</h2>
      <form id="formulario-registro">
        <label for="nombre">Nombre completo</label>
        <input id="nombre" name="nombre" type="text" required minlength="2" autocomplete="name">

        <label for="correo">Correo electrónico</label>
        <input id="correo" name="correo" type="email" required autocomplete="email">

        <label for="taller">Taller</label>
        <select id="taller" name="taller" required>
          <option value="">Selecciona un taller</option>
          <option value="HTML y CSS">HTML y CSS</option>
          <option value="JavaScript">JavaScript</option>
          <option value="Node.js y Express">Node.js y Express</option>
        </select>

         <label for="telefono">Teléfono</label>
         <input id="telefono" name="telefono" type="tel" required autocomplete="tel">


         <label for="horario">Horario</label>
         <select id="horario" name="horario" required>
            <option value="" disabled selected>Seleccione un horario</option>
            <option value="Matutina 07 am - 11 am">Matutina 07 am - 11 am</option>
            <option value="Vespertina 01 pm - 05 pm">Vespertina 01 pm - 05 pm</option>
            <option value="Nocturna 07 pm - 11 pm">Nocturna 07 pm - 11 pm</option>
         </select>

         <fieldset>
  <legend>Sexo</legend>

  <label for="masculino">
    <input id="masculino" type="radio" name="sexo" value="Masculino">
    Masculino
  </label>

  <label for="femenino">
    <input id="femenino" type="radio" name="sexo" value="Femenino">
    Femenino
  </label>
</fieldset>


        <button type="submit">Registrar inscripción</button>
      </form>
      <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
    </section>

    <section class="panel" aria-labelledby="titulo-lista">
      <h2 id="titulo-lista">Participantes inscritos</h2>
      <ul id="lista-inscripciones" aria-live="polite">
        <li class="vacio">Aún no hay inscripciones.</li>
      </ul>
    </section>
  </main>
</body>
<script>
  
</script>
</html>
